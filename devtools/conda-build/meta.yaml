package:
  name: pyside6-addons-uibcdf
  version: "6.9.2"

source:
  path: ../..

build:
  number: 0

requirements:
  host:
    - python =3.13
    - shiboken6-uibcdf ==6.9.2
    - pyside6-essentials-uibcdf ==6.9.2
  run:
    - python =3.13
    - shiboken6-uibcdf ==6.9.2
    - pyside6-essentials-uibcdf ==6.9.2

test:
  commands:
    - test -f "$SP_DIR/PySide6/QtWebChannel.abi3.so"
    - test -f "$SP_DIR/PySide6/QtPositioning.abi3.so"
    - test -f "$SP_DIR/PySide6/QtWebEngineCore.abi3.so"
    - test -f "$SP_DIR/PySide6/QtWebEngineWidgets.abi3.so"
    - test -f "$SP_DIR/PySide6/Qt/libexec/QtWebEngineProcess"
    - python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print(QWebEngineView.__module__)"

about:
  summary: "Experimental UIBCDF-aligned PySide6 Addons package for Linux/Python 3.13."
  license: "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
  description: |
    First experimental conda package boundary for the PySide6 Addons slice in
    the provisional UIBCDF Qt-for-Python family.

extra:
  recipe-maintainers:
    - uibcdf
