name: Stage PySide6 Addons 6.10.1 (Linux)
run-name: Stage Addons 6.10.1 Python ${{ inputs.python_version }} from ${{ inputs.expected_commit }}

# Stage Shiboken, Essentials, Positioning and WebEngine 6.10.1 first.
# GitHub Releases must not upload this coordinated family directly to main.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character candidate commit to build
        required: true
        type: string
      python_version:
        description: Python minor for this binding artifact
        required: true
        type: choice
        options: ["3.11", "3.12", "3.13", "3.14"]

permissions:
  contents: read

concurrency:
  group: qt6101-stage-addons-${{ inputs.python_version }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CPU_COUNT: "4"
    steps:
      - name: Verify the immutable source selector
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/python-3.14-qt-6.10.1
          test "$EXPECTED_COMMIT" = c45844a0bbacfd9b934a09dfe39768cb9e1a965d
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Verify the checked-out source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: python=${{ inputs.python_version }}
      - name: Build, test and upload only to staging
        id: package
        uses: uibcdf/action-build-and-upload-conda-packages@v2.2.2
        with:
          meta_yaml_dir: devtools/conda-build
          mambabuild: false
          user: uibcdf
          label: staging
          conda_build_args: >-
            --package-format conda --python ${{ inputs.python_version }}
            --override-channels -c uibcdf/label/staging -c uibcdf -c conda-forge
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
      - name: Retain the staged producer evidence
        if: ${{ always() && steps.package.outputs.evidence_path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.package.outputs.evidence_artifact_name }}
          path: ${{ steps.package.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
